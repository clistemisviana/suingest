<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuinGest — Gestão de Suinocultura</title>
<style>
  :root{
    --bg:#EEF2F3; --surface:#FFFFFF; --surface-2:#F5F8F7;
    --ink:#0F2A40; --muted:#5E6C74; --line:#E2E8EA;
    --primary:#1E7D34; --primary-d:#14602A; --primary-l:#E6F2E8; --primary-t:#CDE6D2;
    --lime:#5CA62A; --amber:#E87B2A; --amber-l:#FCEBDD;
    --danger:#D9542E; --danger-l:#FBE7DF;
    --info:#0B3A5E; --info-l:#E4EDF4;
    --ativo:#1E9E42; --vendido:#12608F; --morto:#D9542E; --descartado:#97A0A6;
    --tier5:#1E7D34; --tier5-l:#E6F2E8; --tier4:#5C8A1E; --tier4-l:#EEF3DE;
    --tier3:#A9840E; --tier3-l:#FBF3D9; --tier2:#B5601A; --tier2-l:#FCEBDD; --tier1:#C33F27; --tier1-l:#FBE7DF;
    --radius:16px; --radius-s:11px;
    --sh-1:0 1px 2px rgba(15,26,22,.05);
    --sh-2:0 1px 2px rgba(15,26,22,.05), 0 14px 30px -14px rgba(15,26,22,.16);
    --sh-3:0 1px 2px rgba(15,26,22,.06), 0 26px 46px -18px rgba(15,26,22,.28);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:15px;color:var(--ink)}
  .ic{width:20px;height:20px;flex:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke:currentColor;vertical-align:middle}

  /* Topbar */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.85);backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 clamp(14px,3vw,32px);height:64px}
  .brand{display:flex;align-items:center}
  .logo-img{height:46px;width:auto;display:block}
  .logo-suin{height:58px;width:auto;display:block}
  @media(max-width:900px){.logo-suin{height:44px}}
  @media(max-width:560px){.logo-suin{display:none}}
  .nav{display:flex;gap:3px;margin-left:14px}
  .nav button{color:var(--muted);padding:9px 15px;border-radius:10px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;transition:.15s}
  .nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button.on{background:var(--primary-l);color:var(--primary-d)}
  .nav button.on .ic{stroke:var(--primary)}
  .spacer{flex:1}
  .tool-btn{color:var(--muted);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;transition:.15s;border:1px solid transparent}
  .tool-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}

  /* Botão flutuante "voltar ao topo" (funciona na página e dentro de modais) */
  .fab-top{position:fixed;right:22px;bottom:22px;z-index:55;width:50px;height:50px;border-radius:50%;
    background:var(--primary);border:none;box-shadow:0 12px 26px -8px rgba(30,125,52,.55),var(--sh-3);display:grid;place-items:center;
    color:#fff;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s,background .15s}
  .fab-top.show{opacity:1;pointer-events:auto;transform:none}
  .fab-top:hover{background:var(--primary-d);transform:translateY(-3px) scale(1.05)}
  .fab-top .ic{width:24px;height:24px;stroke-width:2.3}
  @media(max-width:900px){.fab-top{bottom:82px}}

  /* Rodapé C.On */
  .app-footer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px 16px 34px;color:var(--muted);font-size:12.5px;text-align:center}
  .app-footer .footer-row{display:flex;align-items:center;justify-content:center;gap:10px}
  .app-footer img{height:30px;width:auto;display:block;flex:none}
  .app-footer b{color:var(--ink);font-weight:700}
  .footer-wa{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);transition:.15s}
  .footer-wa:hover{color:#1c8a4a;border-color:#bfe6cf;background:#F1FAF4}
  .footer-wa .wa-ic{width:16px;height:16px;flex:none}
  @media(max-width:900px){.app-footer{padding-bottom:96px}}

  .wrap{width:100%;max-width:1560px;margin:0 auto;padding:clamp(18px,2.5vw,30px) clamp(14px,3vw,36px) 100px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .page-head h1{font-size:25px;font-weight:680;letter-spacing:-.6px}
  .page-head p{color:var(--muted);font-size:14px;margin-top:3px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--primary);margin-bottom:7px}

  /* KPI cards - com profundidade, sem barra lateral, zoom no hover */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px;box-shadow:var(--sh-2);
    transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s;cursor:default}
  .kpi:hover{transform:translateY(-5px) scale(1.02);box-shadow:var(--sh-3)}
  .kpi .top{display:flex;align-items:center;gap:12px;margin-bottom:15px}
  .kpi .chip{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
  .kpi .chip .ic{width:26px;height:26px}
  .chip.c-emerald{background:var(--primary-l)} .chip.c-emerald .ic{stroke:var(--primary)}
  .chip.c-amber{background:var(--amber-l)} .chip.c-amber .ic{stroke:var(--amber)}
  .chip.c-info{background:var(--info-l)} .chip.c-info .ic{stroke:var(--info)}
  .chip.c-green{background:#E2F3EB} .chip.c-green .ic{stroke:var(--ativo)}
  .chip.c-dark{background:var(--info)} .chip.c-dark .ic{stroke:#fff}
  .chip.c-plain{background:var(--surface-2)}
  .ic-img{display:block;object-fit:contain}
  .lan-card .lan-ico{height:58px;display:flex;align-items:center;margin-bottom:13px}
  .kpi .lab{font-size:13.5px;color:var(--muted);font-weight:600}
  .kpi .val{font-size:30px;font-weight:740;letter-spacing:-1px}
  .kpi .val.neg{color:var(--danger)} .kpi .val.pos{color:var(--primary)}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:5px}

  /* Charts row */
  .charts{display:grid;grid-template-columns:1.65fr 1fr;gap:14px;margin-bottom:18px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);overflow:hidden}
  .panel + .panel{margin-top:16px}
  .panel-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .panel-head h2{font-size:18px;font-weight:680;display:flex;align-items:center;gap:10px}
  .panel-head h2 .ic{width:20px;height:20px;stroke:var(--primary)}
  .panel-head .hint{font-size:12.5px;color:var(--muted)}
  .panel-body{padding:18px 20px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
  .legend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:500}
  .dot{width:10px;height:10px;border-radius:3px;flex:none}

  .donut-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .donut-legend{width:100%;display:flex;flex-direction:column;gap:9px}
  .donut-legend .row{display:flex;align-items:center;justify-content:space-between;font-size:13.5px}
  .donut-legend .row .l{display:flex;align-items:center;gap:9px;color:var(--muted)}
  .donut-legend .row b{font-variant-numeric:tabular-nums}
  .info-grid{display:flex;flex-wrap:wrap;gap:16px}
  .info-card{position:relative;flex:1 1 400px;display:flex;gap:22px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:20px 24px;transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s}
  .info-card:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
  .info-ring{flex:none}
  .info-body{flex:1;min-width:0}
  .info-title{font-size:19px;font-weight:720;letter-spacing:-.3px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .star{font-size:11px;font-weight:700;color:#a85717;background:var(--amber-l);padding:3px 10px;border-radius:20px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat .sl{font-size:11.5px;color:var(--muted);font-weight:600}
  .stat .sv{font-size:16.5px;font-weight:720;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
  .stat .sv.accent{color:var(--amber)} .stat .sv.pos{color:var(--primary)} .stat .sv.neg{color:var(--danger)}
  @media(max-width:520px){.stat-grid{grid-template-columns:1fr}.info-card{flex-direction:column;text-align:center;align-items:center}}
  .info-i{position:absolute;top:14px;right:14px;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);transition:.15s;z-index:2}
  .info-i:hover{color:var(--primary);border-color:var(--primary-t);background:var(--primary-l);transform:scale(1.08)}
  .info-i .ic{width:17px;height:17px}
  .tipo-cell{display:inline-flex;align-items:center;gap:6px}
  .tipo-cell .ic{width:16px;height:16px;flex:none}
  .modal.wide{max-width:960px}
  .modal.form{max-width:800px}
  .modal.form .modal-body{max-height:82vh}
  .wide-body{max-height:74vh}
  .mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .mstat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 15px;display:flex;flex-direction:column;gap:3px}
  .mstat .ml{font-size:11.5px;color:var(--muted);font-weight:600}
  .mstat .mv{font-size:18px;font-weight:720;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .mstat .msub{font-size:11px;font-weight:600;margin-top:1px;color:var(--muted)}
  .mstat .mv-num{font-size:23px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.15}
  .mstat .mv-unit{font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
  .mstat .mchip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;width:fit-content}
  .mstat .mchip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .mchip.t5{color:var(--tier5);background:var(--tier5-l)}
  .mchip.t4{color:var(--tier4);background:var(--tier4-l)}
  .mchip.t3{color:var(--tier3);background:var(--tier3-l)}
  .mchip.t2{color:var(--tier2);background:var(--tier2-l)}
  .mchip.t1{color:var(--tier1);background:var(--tier1-l)}
  .sexcomp{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
  .sc-item{flex:1 1 160px;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;color:#fff}
  .sc-item.sc-m{background:#1B6FB0} .sc-item.sc-f{background:#C0568E}
  .sc-item span{font-size:12.5px;opacity:.92} .sc-item b{font-size:20px;font-weight:740} .sc-item small{font-size:11px;opacity:.85}
  .sc-win{flex:1 1 100%;background:var(--primary-l);color:var(--primary-d);font-weight:700;border-radius:12px;padding:10px 16px;display:flex;align-items:center;justify-content:center;font-size:14px}
  .mchart-title{font-size:14px;font-weight:660;color:var(--ink);display:flex;align-items:center;gap:8px;margin-top:4px}
  .ca-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.ca-charts{grid-template-columns:1fr}}
  .ca-chart-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px 8px}
  .ca-chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  .ca-chart-head h5{font-size:13px;font-weight:700}
  .ca-chart-head span{font-size:11px;color:var(--muted);font-weight:600}
  .ca-chart-note{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
  .ca-legend-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--surface-2);border-radius:11px;flex-wrap:wrap}
  .ca-legend-range{font-size:12px;font-weight:700;color:var(--ink);text-align:right;line-height:1.45}
  .mchart-title .ic{width:17px;height:17px;stroke:var(--primary)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .info-i-sm{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);transition:.14s;vertical-align:middle}
  .info-i-sm:hover{color:var(--primary);border-color:var(--primary-t);background:var(--primary-l)}
  .info-i-sm .ic{width:15px;height:15px}
  .timeline{display:flex;flex-direction:column;padding-left:2px}
  .tl-item{display:flex;gap:14px;padding:9px 0;position:relative}
  .tl-item:not(:last-child)::before{content:"";position:absolute;left:17px;top:36px;bottom:-9px;width:2px;background:var(--line)}
  .tl-ic{width:36px;height:36px;flex:none;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;z-index:1}
  .tl-ic .ic{width:18px;height:18px;stroke:var(--primary)}
  .tl-body{flex:1;padding-top:3px;min-width:0}
  .tl-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
  .tl-top span{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .tl-desc{font-size:13px;color:var(--muted);margin-top:2px}
  /* ---- PDF / impressão ---- */
  #printArea{display:none}
  .pdf-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--primary);padding-bottom:12px;margin-bottom:18px}
  .pdf-logo{height:46px;width:auto}
  .pdf-title{font-size:21px;font-weight:740;letter-spacing:-.4px}
  .pdf-sub{font-size:12px;color:var(--muted)}
  .pdf-animal{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .pdf-animal h3{font-size:17px;font-weight:720;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pdf-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .pdf-resumo .mstat{padding:9px 12px}
  @media print{
    body{background:#fff}
    body>*{display:none!important}
    #printArea{display:block!important}
    #printArea .btn,#printArea .act-btn,#printArea .info-i,#printArea .info-i-sm,#printArea .modal-foot,#printArea .modal-head .x,#printArea .chev,#printArea .tool-btn,#printArea button{display:none!important}
    #printArea .panel,#printArea .kpi,#printArea .info-card,#printArea .mstat,#printArea .pdf-animal,#printArea .detail-inner,#printArea svg{break-inside:avoid;box-shadow:none!important}
    #printArea .kpi:hover,#printArea .info-card:hover{transform:none!important}
    #printArea .table-scroll{overflow:visible!important}
    #printArea .filtro{display:none!important}
    @page{margin:12mm}
  }
  .pdf-sel{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;cursor:pointer}
  .pdf-sel:hover{background:var(--surface-2)}
  .pdf-sel input{width:16px;height:16px;accent-color:var(--primary)}
  .filtro{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1);padding:11px 14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px 24px}
  .fgrp{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 300px}
  .flab{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .flab .ic{width:15px;height:15px;stroke:var(--primary)}
  .fscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}
  .fbtn{flex:none;padding:7px 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:13px;transition:.12s;white-space:nowrap;cursor:pointer}
  .fbtn:hover{border-color:var(--primary-t);color:var(--ink)}
  .fbtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .sx{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
  .sx-m{background:#E1EEF7;color:#1b6fb0} .sx-f{background:#F7E4EF;color:#a5407a}
  .sx-t{background:#FDF0DC;color:#8a5200}

  /* Tables */
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:separate;border-spacing:0;min-width:520px}
  th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.85px;text-transform:uppercase;color:var(--muted);padding:14px 18px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--surface)}
  td{padding:15px 18px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tbody tr{transition:background .12s}
  tbody tr:not(.detail-row):hover{background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums} .center{text-align:center}
  .money{font-variant-numeric:tabular-nums;font-weight:600}
  .pos{color:var(--primary)} .neg{color:var(--danger)}
  .empty{text-align:center;color:var(--muted);padding:46px 16px;font-size:14.5px}
  .empty .ei{width:40px;height:40px;stroke:var(--muted);opacity:.5;margin:0 auto 12px;display:block}
  /* peso duplo kg/@ */
  .pw b{display:block;font-weight:640;line-height:1.15}
  .pw span{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* Lançamento cards */
  .lan-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
  .lan-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--sh-2);text-align:left;position:relative;
    transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s}
  .lan-card:hover{transform:translateY(-4px) scale(1.02);box-shadow:var(--sh-3);border-color:var(--primary-t)}
  .lan-card .chip{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin-bottom:13px}
  .lan-card .chip .ic{width:23px;height:23px}
  .lan-card .t{font-weight:700;font-size:17px}
  .lan-card .c{font-size:13px;color:var(--muted);margin-top:3px}
  .lan-card .cnt{position:absolute;top:15px;right:15px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid var(--line)}

  /* Badges */
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .badge .bd{width:7px;height:7px;border-radius:50%}
  .b-ativo{background:#E4F3E7;color:#14732B} .b-ativo .bd{background:var(--ativo)}
  .b-vendido{background:var(--info-l);color:#0d4166} .b-vendido .bd{background:var(--vendido)}
  .b-morto{background:var(--danger-l);color:#a53c1c} .b-morto .bd{background:var(--morto)}
  .b-descartado{background:#EEF0EF;color:#5d655f} .b-descartado .bd{background:var(--descartado)}
  .b-receb{background:#E4F3E7;color:#14732B} .b-receb .bd{background:var(--ativo)}
  .b-aguard{background:var(--amber-l);color:#a85717} .b-aguard .bd{background:var(--amber)}
  .tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
  .tag.ind{background:var(--primary-l);color:var(--primary-d);border-color:transparent}
  .tag.rat{background:var(--amber-l);color:#a85717;border-color:transparent}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;font-weight:600;font-size:14px;padding:10px 17px;border-radius:12px;transition:.15s;box-shadow:var(--sh-1)}
  .btn:hover{background:var(--primary-d);transform:translateY(-1px)}
  .btn .ic{width:18px;height:18px;stroke:#fff}
  .btn.ghost{background:var(--surface);color:var(--primary);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{background:var(--primary-l);border-color:var(--primary-t)}
  .btn.ghost .ic{stroke:var(--primary)}
  .btn.danger{background:var(--danger)} .btn.danger:hover{background:#c03f28}
  .act-btn{width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;transition:.12s;color:var(--muted)}
  .act-btn .ic{width:16px;height:16px}
  .act-btn:hover{background:var(--surface-2);color:var(--ink)}
  .act-btn.del:hover{background:var(--danger-l);color:var(--danger)}

  /* Gestão expand */
  .ges-macro{cursor:pointer;transition:.12s}
  .ges-macro:hover{background:var(--surface-2)}
  .chev{transition:transform .2s;stroke:var(--muted);width:16px;height:16px}
  .ges-macro.open .chev{transform:rotate(90deg);stroke:var(--primary)}
  .detail-wrap{padding:0!important;background:var(--surface-2)}
  .detail-inner{padding:8px 18px 18px 40px}
  .detail-inner table{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:640px}
  .detail-inner th{background:#EFF3F1;font-size:10px;padding:9px 12px}
  .detail-inner td{padding:10px 12px;font-size:13px}
  .es-in{color:var(--danger);font-weight:700} .es-out{color:var(--primary);font-weight:700}
  .det-summary{display:flex;gap:20px;justify-content:flex-end;flex-wrap:wrap;padding:13px 6px 2px;font-size:13.5px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,26,22,.5);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:38px 16px;overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:var(--surface);border-radius:20px;width:100%;max-width:560px;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{font-size:17.5px;font-weight:680;display:flex;align-items:center;gap:11px}
  .modal-head h3 .chip{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
  .modal-head h3 .chip .ic{width:19px;height:19px}
  .modal-head .x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
  .modal-head .x:hover{background:var(--surface-2);color:var(--ink)}
  .modal-body{padding:22px;display:grid;gap:15px;max-height:66vh;overflow-y:auto;overflow-x:hidden}
  .modal-foot{padding:17px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:11px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;font-weight:600}
  .field .req{color:var(--danger)}
  .field input,.field select{padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);transition:.12s}
  .field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
  .field input:disabled{background:var(--surface-2);color:var(--muted)}
  .field .help{font-size:11.5px;color:var(--muted)}
  .field-grp{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .field-grp3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--line)}
  .seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;transition:.12s}
  .seg button .ic{width:16px;height:16px}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
  .seg button.on .ic{stroke:var(--primary)}
  .auto-pill{display:inline-flex;align-items:center;gap:5px;background:var(--primary-l);color:var(--primary-d);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
  .auto-pill .ic{width:13px;height:13px;stroke:var(--primary)}
  .calc-line{background:var(--primary-l);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--primary-d);font-weight:600;display:flex;align-items:center;gap:8px}
  .calc-line .ic{width:16px;height:16px;stroke:var(--primary)}
  .lote-checks{display:flex;flex-direction:column;gap:4px;max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;padding:8px}
  .lote-check{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer;font-weight:400}
  .lote-check:hover{background:var(--surface-2)}
  .lote-check input{margin-top:3px;flex:none}
  .lote-check b{font-size:13.5px;font-weight:700}
  .lote-check .lc-count{color:var(--muted);font-weight:600;font-size:12.5px}
  .lote-check .lc-animais{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}

  /* Toast */
  .toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.28);animation:slideup .25s;display:flex;align-items:center;gap:9px}
  .toast .ic{width:18px;height:18px;stroke:#fff}
  .toast.ok{background:var(--primary-d)} .toast.err{background:var(--danger)}
  @keyframes slideup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* Mobile bottom nav */
  .mobnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:35;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:7px 6px 9px;justify-content:space-around}
  .mobnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;color:var(--muted);font-size:11px;font-weight:600;border-radius:10px}
  .mobnav button .ic{width:22px;height:22px}
  .mobnav button.on{color:var(--primary)} .mobnav button.on .ic{stroke:var(--primary)}

  @media(max-width:900px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .charts{grid-template-columns:1fr}
    .nav{display:none} .mobnav{display:flex} .hide-sm{display:none}
    .field-grp,.field-grp3{grid-template-columns:1fr}
  }
  @media(max-width:520px){.kpis{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ============ Armazenamento local ============ */
const KEY='suingest_v2';
const ARROBA=15;
const CORES_PADRAO=[['Amarelo','AMA'],['Azul','AZL'],['Branco','BRC'],['Preto','PRT'],['Vermelho','VRM'],['Verde','VRD'],['Laranja','LAR'],['Roxo','ROX'],['Rosa','RSA'],['Marrom','MRM'],['Cinza','CNZ']];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let DB=load();
function load(){
  let d; try{ d=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  d=Object.assign({racas:[],coresBrinco:[],animais:[],racoes:[],estruturas:[],vendas:[],pesagens:[],seq:0}, d||{});
  if(!d.pesagens)d.pesagens=[];
  if(!d.coresBrinco||!d.coresBrinco.length) d.coresBrinco=CORES_PADRAO.map(([nome,sigla])=>({id:uid(),nome,sigla}));
  d.animais.forEach(a=>{ if(a.valorCompra==null)a.valorCompra=0; if(a.sexo==null)a.sexo='';
    if(a.terceiro==null)a.terceiro=false; if(a.donoNome==null)a.donoNome='';
    if(a.corId==null)a.corId=''; if(a.brincoNum==null)a.brincoNum=''; if(a.brincoAno==null)a.brincoAno='';
    if(a.dataCompra==null)a.dataCompra=a.dataChegada||''; });
  d.vendas.forEach(v=>{ if(v.precoArroba==null)v.precoArroba=v.pesoFinalKg?+(v.valorVenda/(v.pesoFinalKg/ARROBA)).toFixed(2):0; });
  d.config=Object.assign({rendimento:75,fitaDivisor:14430}, d.config||{});
  return d;
}
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function nextCodigo(){ DB.seq=(DB.seq||0)+1; return 'P'+String(DB.seq).padStart(4,'0'); }
const nextCodigoPreview=()=>'P'+String((DB.seq||0)+1).padStart(4,'0');

/* ============ Helpers ============ */
const fmtBRL=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtN=(n,d=1)=>(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
function fmtData(iso){ if(!iso)return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
const hoje=()=>new Date().toISOString().slice(0,10);
const mesLabel=ym=>{const [y,m]=ym.split('-');return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]+'/'+y.slice(2);};
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const arr=kg=>(kg||0)/ARROBA;
const rendFrac=()=>(((DB.config&&DB.config.rendimento)||75)/100)||0.75;
const vivoDeCarcaca=c=>(c||0)/rendFrac();
const ALVO6_CARC=90;                 /* 6 arrobas em CARCAÇA (kg) */
const alvoVivo6=()=>vivoDeCarcaca(ALVO6_CARC);   /* alvo em peso VIVO */
function pesoCell(kg){ if(!kg&&kg!==0)return '—'; return `<div class="pw"><b>${fmtN(kg)} kg</b><span>${fmtN(arr(kg),2)} @</span></div>`; }
function idadeDias(nasc,fim){ if(!nasc)return null; return Math.max(0,Math.round((new Date(fim||hoje())-new Date(nasc))/86400000)); }
function idadeTxt(nasc,fim){ const d=idadeDias(nasc,fim); if(d===null)return '—'; return `${d} d · ${fmtN(d/30,1)} m`; }
const racaNome=id=>(DB.racas.find(r=>r.id===id)||{}).nome||'—';
const corSigla=id=>((DB.coresBrinco||[]).find(c=>c.id===id)||{}).sigla||'';
const corNome=id=>((DB.coresBrinco||[]).find(c=>c.id===id)||{}).nome||'—';
function brincoLabel(a){ if(a&&a.corId&&a.brincoNum) return `${corSigla(a.corId)} ${a.brincoNum}/${a.brincoAno||''}`; return (a&&a.codigo)||'—'; }
const anoAtual2=()=>String(new Date().getFullYear()).slice(-2);
const animalByCod=id=>DB.animais.find(a=>a.id===id);
const lotesAtivos=()=>[...new Set(DB.animais.map(a=>a.lote).filter(Boolean))].sort();
const animaisAtivosDoLote=l=>DB.animais.filter(a=>a.lote===l&&a.status==='ativo');
const STATUS={ativo:{l:'Ativo',c:'b-ativo'},vendido:{l:'Vendido',c:'b-vendido'},morto:{l:'Baixa',c:'b-morto'},descartado:{l:'Descartado',c:'b-descartado'}};
const badge=st=>`<span class="badge ${STATUS[st].c}"><span class="bd"></span>${STATUS[st].l}</span>`;

/* ---- custos por animal (inclui a COMPRA) ---- */
function despesasDoAnimal(animalId){
  const a=animalByCod(animalId); const out=[];
  if(a&&a.valorCompra>0) out.push({data:a.dataCompra||a.dataChegada,cat:'compra',desc:'Compra do animal',valor:a.valorCompra,origem:'ind',srcId:a.id,srcKind:'animal'});
  DB.racoes.forEach(r=>addCusto(out,r,'racao',animalId));
  DB.estruturas.forEach(e=>addCusto(out,e,'estrutura',animalId));
  return out.sort((x,y)=>(x.data||'').localeCompare(y.data||''));
}
function addCusto(out,rec,cat,animalId){
  if(rec.destinoTipo==='animal'&&rec.alvo===animalId)
    out.push({data:rec.data,cat,desc:cat==='racao'?rec.tipo:rec.descricao,qtd:rec.qtd,volume:rec.volume,valor:rec.valor,origem:'ind',srcId:rec.id,srcKind:cat});
  else if((rec.destinoTipo==='lote'||rec.destinoTipo==='geral')&&rec.participantes&&rec.participantes.includes(animalId))
    out.push({data:rec.data,cat,desc:cat==='racao'?rec.tipo:rec.descricao,qtd:rec.qtd,volume:rec.volume,valor:rec.valor/rec.participantes.length,origem:'rat',srcId:rec.id,srcKind:cat});
}
const vendaDoAnimal=id=>DB.vendas.find(v=>v.animalId===id);
const pesagensAnimal=id=>(DB.pesagens||[]).filter(p=>p.animalId===id).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
function pesoFinalVivo(a){ const v=vendaDoAnimal(a.id); return v?vivoDeCarcaca(v.pesoFinalKg):null; }
function pesoAtual(a){
  const pts=[]; pesagensAnimal(a.id).forEach(p=>pts.push({d:p.data,w:p.peso}));
  const v=vendaDoAnimal(a.id); if(v)pts.push({d:v.dataVenda,w:vivoDeCarcaca(v.pesoFinalKg)});
  if(pts.length){ pts.sort((x,y)=>(x.d||'').localeCompare(y.d||'')); return pts[pts.length-1].w; }
  return a.pesoInicial||0;
}
function consumoRacaoAnimal(id){ let kg=0; DB.racoes.forEach(r=>{ if(!r.volume)return;
  if(r.destinoTipo==='animal'&&r.alvo===id) kg+=r.volume;
  else if((r.destinoTipo==='lote'||r.destinoTipo==='geral')&&r.participantes&&r.participantes.includes(id)) kg+=r.volume/r.participantes.length; });
  return kg; }
const diasNaGranja=a=>{ const ini=a.dataChegada||a.dataCompra; return ini?idadeDias(ini,a.dataEncerramento):null; };
/* pontos de peso ordenados: entrada + pesagens + venda (em peso vivo) */
function pontosPeso(a){
  const pts=[]; const d0=a.dataChegada||a.dataCompra||a.dataNascimento;
  if(a.pesoInicial) pts.push({d:d0,w:a.pesoInicial,tipo:'entrada'});
  pesagensAnimal(a.id).forEach(p=>pts.push({d:p.data,w:p.peso,tipo:'pesagem',pid:p.id}));
  const v=vendaDoAnimal(a.id); if(v) pts.push({d:v.dataVenda,w:vivoDeCarcaca(v.pesoFinalKg),tipo:'venda',carc:v.pesoFinalKg});
  return pts.filter(p=>p.d&&p.w).sort((x,y)=>x.d.localeCompare(y.d));
}
/* ração alocada ao animal num intervalo (d1, d2]  -> {kg, val} */
function racaoAnimalPeriodo(id,d1,d2){ let kg=0,val=0;
  DB.racoes.forEach(r=>{ if(!r.data||r.data<=d1||r.data>d2)return; let s=0;
    if(r.destinoTipo==='animal'&&r.alvo===id)s=1; else if((r.destinoTipo==='lote'||r.destinoTipo==='geral')&&r.participantes&&r.participantes.includes(id))s=1/r.participantes.length;
    if(s){kg+=(r.volume||0)*s; val+=(r.valor||0)*s;} });
  return {kg,val};
}
/* estrutura/sanidade alocada ao animal num intervalo (d1, d2] -> val */
function estruturaAnimalPeriodo(id,d1,d2){ let val=0;
  DB.estruturas.forEach(e=>{ if(!e.data||e.data<=d1||e.data>d2)return; let s=0;
    if(e.destinoTipo==='animal'&&e.alvo===id)s=1; else if((e.destinoTipo==='lote'||e.destinoTipo==='geral')&&e.participantes&&e.participantes.includes(id))s=1/e.participantes.length;
    val+=(e.valor||0)*s; });
  return val;
}
/* ganho médio diário do animal no histórico todo (kg/dia) */
function gmdMedioAnimal(a){ const pts=pontosPeso(a); if(pts.length<2)return null; const f=pts[0],l=pts[pts.length-1]; const d=idadeDias(f.d,l.d); return d?(l.w-f.w)/d:null; }
/* curva média de ganho da raça por mês de vida (idade desde o nascimento) */
function curvaGanhoRaca(nome){
  const buckets={};
  animaisPeriodo().filter(a=>racaNome(a.racaId)===nome && a.dataNascimento).forEach(a=>{
    const nasc=new Date(a.dataNascimento).getTime(); const pts=pontosPeso(a);
    for(let i=1;i<pts.length;i++){ const dias=idadeDias(pts[i-1].d,pts[i].d); if(!dias)continue;
      const gmd=(pts[i].w-pts[i-1].w)/dias;
      const ageStart=Math.floor((new Date(pts[i-1].d).getTime()-nasc)/86400000);
      const mes=Math.max(1,Math.floor(ageStart/30)+1);
      const b=buckets[mes]=buckets[mes]||{soma:0,dias:0,animais:new Set()};
      b.soma+=gmd*dias; b.dias+=dias; b.animais.add(a.id);
    }
  });
  return Object.entries(buckets).map(([mes,b])=>({mes:+mes,gmd:b.dias?b.soma/b.dias:0,n:b.animais.size})).sort((x,y)=>x.mes-y.mes);
}
function resumoAnimal(a){
  const d=despesasDoAnimal(a.id); const totalDesp=d.reduce((s,x)=>s+x.valor,0);
  const venda=vendaDoAnimal(a.id); const receita=venda?venda.valorVenda:0;
  return {despesas:d,totalDesp,venda,receita,lucro:receita-totalDesp,pesoFinal:venda?venda.pesoFinalKg:null};
}
/* ---- animais de terceiro (mão de obra paga em ração) ---- */
const ehTerceiro=a=>!!(a&&a.terceiro);
const meusAnimais=()=>DB.animais.filter(a=>!ehTerceiro(a));
const animaisTerceiros=()=>DB.animais.filter(ehTerceiro);
/* ração que os animais de terceiro consumiram = minha mão de obra */
function maoDeObraLancamentos(){
  const out=[];
  DB.racoes.forEach(r=>{ if(!r.valor)return;
    if(r.destinoTipo==='animal'){ const a=animalByCod(r.alvo); if(a&&ehTerceiro(a)) out.push({data:r.data,valor:r.valor,animalId:a.id,srcId:r.id,desc:r.tipo}); }
    else if((r.destinoTipo==='lote'||r.destinoTipo==='geral')&&r.participantes&&r.participantes.length){
      const cota=r.valor/r.participantes.length;
      r.participantes.forEach(pid=>{ const a=animalByCod(pid); if(a&&ehTerceiro(a)) out.push({data:r.data,valor:cota,animalId:a.id,srcId:r.id,desc:r.tipo}); });
    } });
  return out.sort((x,y)=>(x.data||'').localeCompare(y.data||''));
}
const maoDeObraTotal=()=>maoDeObraLancamentos().filter(m=>noPeriodo(m.data)).reduce((s,m)=>s+m.valor,0);
/* o que EU gastei com um animal de terceiro (só ração) */
const meuCustoComTerceiro=id=>maoDeObraLancamentos().filter(m=>m.animalId===id).reduce((s,m)=>s+m.valor,0);
/* resumo do animal de terceiro nas duas visões */
function resumoTerceiro(a){
  const meuCusto=meuCustoComTerceiro(a.id);
  const v=vendaDoAnimal(a.id); const receita=v?v.valorVenda:0;
  const compra=a.valorCompra||0;
  const d=despesasDoAnimal(a.id);
  const outros=d.filter(x=>x.cat!=='compra'&&x.cat!=='racao').reduce((s,x)=>s+x.valor,0);
  return {meuCusto,receita,compra,outros,
    lucroDono:receita-compra-outros,                 /* o que ele leva (ração foi paga por mim) */
    resultadoEcon:receita-compra-outros-meuCusto};   /* com todos os custos */
}
function totaisGerais(){
  const mo=maoDeObraTotal();
  let racaoTot=0; DB.racoes.forEach(r=>{if(noPeriodo(r.data))racaoTot+=r.valor;});
  const racao=racaoTot-mo;                                   /* ração dos MEUS animais */
  let estr=0; DB.estruturas.forEach(e=>{ if(!noPeriodo(e.data)||!e.valor)return;
    if(e.destinoTipo==='animal'){ const a=animalByCod(e.alvo); if(!ehTerceiro(a||{}))estr+=e.valor; }
    else if((e.destinoTipo==='lote'||e.destinoTipo==='geral')&&e.participantes&&e.participantes.length){
      const cota=e.valor/e.participantes.length;
      e.participantes.forEach(pid=>{ const a=animalByCod(pid); if(!ehTerceiro(a||{}))estr+=cota; });
    } else estr+=e.valor; });
  let compras=0; DB.animais.forEach(a=>{if(!ehTerceiro(a)&&a.valorCompra&&noPeriodo(a.dataCompra||a.dataChegada))compras+=a.valorCompra;});
  const invest=racao+estr+compras+mo;
  let recebida=0,prevista=0; DB.vendas.forEach(v=>{const a=animalByCod(v.animalId); if(ehTerceiro(a||{}))return;
    if(noPeriodo(v.dataVenda))(v.status==='recebido'?recebida+=v.valorVenda:prevista+=v.valorVenda);});
  const ap=animaisPeriodo(), meus=ap.filter(a=>!ehTerceiro(a)), terc=ap.filter(ehTerceiro);
  return {invest,racao,estr,compras,mo,recebida,prevista,lucro:(recebida+prevista)-invest,
    ativos:meus.filter(a=>a.status==='ativo').length,totalAnimais:meus.length,nTerceiros:terc.length};
}

const lancadoEm=a=>a.dataChegada||a.dataCompra||a.dataNascimento||'';
function todasDatas(){ const d=[]; DB.racoes.forEach(r=>d.push(r.data)); DB.estruturas.forEach(e=>d.push(e.data)); DB.vendas.forEach(v=>d.push(v.dataVenda)); (DB.pesagens||[]).forEach(p=>d.push(p.data)); DB.animais.forEach(a=>{d.push(a.dataCompra,a.dataChegada,a.dataNascimento);}); return d.filter(Boolean); }

function datasDoContexto(){ if(PAGE==='lancamentos') return DB.animais.map(lancadoEm).filter(Boolean); return todasDatas(); }
function anosComDados(){ return [...new Set(datasDoContexto().map(x=>x.slice(0,4)))].sort(); }
function mesesComDados(anosSet){ return [...new Set(datasDoContexto().filter(x=>anosSet.has(x.slice(0,4))).map(x=>x.slice(5,7)))].sort(); }
function initFilter(){
  const F=curFilter(), anos=anosComDados();
  if(!anos.length){ F.anos=new Set(); F.meses='todos'; return; }
  if(F.anos===null){ const cur=String(new Date().getFullYear()); F.anos=new Set([anos.includes(cur)?cur:anos[anos.length-1]]); F.meses='todos'; }
  F.anos=new Set([...F.anos].filter(y=>anos.includes(y))); if(!F.anos.size) F.anos=new Set([anos[anos.length-1]]);

function noPeriodo(d){ const F=curFilter(); if(!d)return false; if(!F.anos||!F.anos.size)return true; const y=d.slice(0,4),m=d.slice(5,7); return F.anos.has(y)&&(F.meses==='todos'||F.meses.has(m)); }
function selectedYMs(){ const F=curFilter(); if(!F.anos||!F.anos.size)return null; const meses=F.meses==='todos'?['01','02','03','04','05','06','07','08','09','10','11','12']:[...F.meses]; const out=[]; F.anos.forEach(y=>meses.forEach(m=>out.push(y+'-'+m))); return out; }
/* presença durante o período (Gestão e composição do Dashboard) */
function animalNoPeriodo(a){ const sel=selectedYMs(); if(!sel)return true; const entry=(a.dataChegada||a.dataCompra||a.dataNascimento||'').slice(0,7); const end=(a.dataEncerramento||'').slice(0,7); return sel.some(ym=>(!entry||ym>=entry)&&(!end||ym<=end)); }

function filtroBar(){

  const anoBtns=anos.map(y=>`<button class="fbtn ${F.anos.has(y)?'on':''}" onclick="toggleAno('${y}')">${y}</button>`).join('');

function toggleAno(y){ const F=curFilter(); if(F.anos.has(y)){ if(F.anos.size>1)F.anos.delete(y); } else F.anos.add(y);
  const disp=new Set(mesesComDados(F.anos)); if(F.meses!=='todos'){ F.meses=new Set([...F.meses].filter(m=>disp.has(m))); if(!F.meses.size)F.meses='todos'; } render(); }

function toggleMes(m){ const F=curFilter(); if(F.meses==='todos')F.meses=new Set(); if(F.meses.has(m))F.meses.delete(m); else F.meses.add(m); if(!F.meses.size)F.meses='todos'; render(); }

/* ---- gráfico de LINHA: investido x receita por mês (até 12) ---- */
function fmtK(n){n=n||0;return Math.abs(n)>=1000?(n/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'k':Math.round(n).toString();}
function smoothPath(pts){
  if(!pts.length)return'';if(pts.length===1)return `M${pts[0].x} ${pts[0].y}`;
  let d=`M${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x} ${p2.y}`;}
  return d;
}
function renderLinha(buckets,sfx='',compact=false){
  const meses=Object.keys(buckets).sort().slice(-12);
  if(!meses.length) return `<div class="empty" style="padding:30px">${ic('chart','ei')}Sem movimentação financeira no período.</div>`;
  const max=Math.max(1,...meses.flatMap(m=>[buckets[m].inv,buckets[m].rec]));
  const W=1000,H=compact?230:312,padL=64,padR=64,padT=compact?38:48,padB=compact?52:58,cw=W-padL-padR,ch=H-padT-padB,n=meses.length;
  const OR='#E87B2A',GR='#1E7D34';
  const X=i=>n===1?padL+cw/2:padL+cw*i/(n-1), Y=v=>padT+ch-(v/max)*ch;
  const invPts=meses.map((m,i)=>({x:X(i),y:Y(buckets[m].inv),v:buckets[m].inv}));
  const recPts=meses.map((m,i)=>({x:X(i),y:Y(buckets[m].rec),v:buckets[m].rec}));
  const gi='gInv'+sfx,gr='gRec'+sfx;
  const area=(pts,id)=>`<path d="${smoothPath(pts)} L${pts[n-1].x} ${padT+ch} L${pts[0].x} ${padT+ch} Z" fill="url(#${id})" opacity=".16"/>`;
  const line=(pts,c)=>`<path d="${smoothPath(pts)}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;

  const pesoIni=[],ganho=[],ganhoMes=[],pesoFin=[],lucro=[],preco=[],dias=[]; let nVend=0;

/* ---- pontos de CA por intervalo entre pesagens (EA é sempre 100/CA) ---- */
const CA_META=2.55, EA_META=100/CA_META;
function caPontos(a){
  const pts=pontosPeso(a); const out=[];
  for(let i=1;i<pts.length;i++){
    const prev=pts[i-1], cur=pts[i];
    const dias=idadeDias(prev.d,cur.d), ganho=cur.w-prev.w;
    if(!dias||ganho<=0) continue;
    const rac=racaoAnimalPeriodo(a.id,prev.d,cur.d);
    if(!rac.kg) continue;
    out.push({d:cur.d,ca:rac.kg/ganho,i});
  }
  return out;
}
/* mini-gráfico CA ou EA ao longo do tempo. lowerIsBetter define a direção do eixo (sempre com o "bom" para cima) */
function miniChartCaEa(pontos,animalId,{lowerIsBetter,valorFn,meta,metaTxt,fmt}){
  const W=440,H=196,padL=40,padR=14,padT=26,padB=30,cw=W-padL-padR,ch=H-padT-padB;
  const vals=pontos.map(p=>valorFn(p.ca));
  const minV=Math.min(meta,...vals)*0.9, maxV=Math.max(meta,...vals)*1.1;
  const X=idx=>pontos.length===1?padL+cw/2:padL+cw*idx/(pontos.length-1);
  const Y=v=>{ const t=(v-minV)/((maxV-minV)||1); return lowerIsBetter?padT+t*ch:padT+(1-t)*ch; };
  const yMeta=Y(meta);
  const metaLine=`<line x1="${padL}" y1="${yMeta}" x2="${W-padR}" y2="${yMeta}" stroke="var(--tier4)" stroke-width="1.4" stroke-dasharray="5 5"/><text x="${padL}" y="${yMeta-7}" font-size="10.5" fill="var(--tier4)" font-weight="700">meta ${metaTxt}</text>`;
  const coords=pontos.map((p,idx)=>({x:X(idx),y:Y(valorFn(p.ca)),p}));
  const line=coords.length>1?`<polyline points="${coords.map(c=>`${c.x},${c.y}`).join(' ')}" fill="none" stroke="var(--line)" stroke-width="2"/>`:'';
  const dots=coords.map(c=>{const t=caTier(c.p.ca);
    return `<circle cx="${c.x}" cy="${c.y}" r="6" fill="var(--${t.cls})" stroke="#fff" stroke-width="1.6" style="cursor:pointer" onclick="modalPontoPeso('${animalId}',${c.p.i})"><title>Ver intervalo</title></circle>
      <text x="${c.x}" y="${c.y-12}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--${t.cls})">${fmt(valorFn(c.p.ca))}</text>`;
  }).join('');
  const xlabels=coords.map(c=>`<text x="${c.x}" y="${H-12}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${fmtData(c.p.d)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">${metaLine}${line}${dots}${xlabels}</svg>`;
}
function chartCaEa(a){

/* ---- gráfico de peso ao longo do tempo + projeção para 6@ ---- */
function chartPeso(a){
  const alvo=alvoVivo6();
  const pts=pontosPeso(a);
  if(!pts.length) return `<div class="empty" style="padding:24px">${ic('scale','ei')}Sem dados de peso. Lance pesagens para ver a curva.</div>`;
  const t0=new Date(pts[0].d).getTime(); const dpts=pts.map(p=>({x:Math.round((new Date(p.d).getTime()-t0)/86400000),w:p.w,d:p.d}));
  let proj=null,rate=null;
  if(dpts.length>=2){ const f=dpts[0],last=dpts[dpts.length-1];
    if(last.x>f.x){ rate=(last.w-f.w)/(last.x-f.x); if(rate>0&&last.w<alvo){const dd=(alvo-last.w)/rate; proj={x:last.x+dd,totalDias:Math.round(last.x+dd)};} } }
  const maxX=Math.max(1,...dpts.map(p=>p.x),proj?proj.x:0);
  const maxW=Math.max(alvo,...dpts.map(p=>p.w))*1.08;
  const W=1000,H=300,padL=48,padR=30,padT=30,padB=60,cw=W-padL-padR,ch=H-padT-padB;
  const X=x=>dpts.length===1&&!proj?padL+cw/2:padL+cw*x/maxX, Y=w=>padT+ch-(w/maxW)*ch;
  const GR='#1E7D34',OR='#E87B2A',NV='#0B3A5E';
  const projDate=proj?new Date(t0+Math.round(proj.x)*86400000).toISOString().slice(0,10):null;
  const yA=Y(alvo);
  const ref=`<line x1="${padL}" y1="${yA}" x2="${W-padR}" y2="${yA}" stroke="${OR}" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${padL}" y="${yA-7}" font-size="11" fill="${OR}" text-anchor="start" font-weight="700">Meta 6@ carcaça = ${fmtN(alvo,0)} kg vivo</text>`;
  const lp=dpts.map(p=>({x:X(p.x),y:Y(p.w)}));
  const line=`<path d="${smoothPath(lp)}" fill="none" stroke="${GR}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  let projLine='';
  if(proj){const a1=lp[lp.length-1],b1={x:X(proj.x),y:Y(alvo)};const anc=b1.x>W-80?'end':'middle';
    projLine=`<path d="M${a1.x} ${a1.y} L${b1.x} ${b1.y}" stroke="${GR}" stroke-width="2.5" stroke-dasharray="6 6" fill="none" opacity=".55"/>`
     +`<line x1="${b1.x}" y1="${b1.y+7}" x2="${b1.x}" y2="${H-40}" stroke="${NV}" stroke-width="1.3"/>`
     +`<circle cx="${b1.x}" cy="${b1.y}" r="5.5" fill="${GR}" stroke="#fff" stroke-width="1.5"/>`
     +`<text x="${b1.x}" y="${H-25}" font-size="11.5" fill="${NV}" text-anchor="${anc}" font-weight="700">${fmtData(projDate)}</text>`
     +`<text x="${b1.x}" y="${H-9}" font-size="11.5" fill="${OR}" text-anchor="${anc}" font-weight="700">≈ 6@</text>`;}
  const dots=dpts.map((p,i)=>`<circle cx="${X(p.x)}" cy="${Y(p.w)}" r="4.5" fill="#fff" stroke="${GR}" stroke-width="2.5"/><text x="${X(p.x)}" y="${Y(p.w)-11}" font-size="11.5" font-weight="700" fill="${GR}" text-anchor="middle">${fmtN(p.w)}</text>`).join('');
  const clicks=dpts.map((p,i)=>`<circle cx="${X(p.x)}" cy="${Y(p.w)}" r="16" fill="transparent" style="cursor:pointer" onclick="modalPontoPeso('${a.id}',${i})"><title>Ver detalhes deste peso</title></circle>`).join('');
  const xlab=dpts.map(p=>`<text x="${X(p.x)}" y="${H-42}" font-size="10.5" fill="var(--muted)" text-anchor="middle">${fmtData(p.d)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">${ref}${line}${projLine}${dots}${xlab}${clicks}</svg>`
    +`<div class="calc-line" style="margin-top:8px;line-height:1.5;align-items:flex-start"><span style="flex:none">${ic('info')}</span><span>Curva em <b>peso vivo</b> (clique num ponto para ver o intervalo). Venda de carcaça convertida pelo rendimento de <b>${(DB.config&&DB.config.rendimento)||75}%</b>.${proj?` No ritmo de <b>${fmtN(rate,2)} kg/dia</b>, atinge <b>6@ de carcaça</b> aos <b>${proj.totalDias} dias</b> de criação, desde a entrada (previsão <b>${fmtData(projDate)}</b>).`:''}</span></div>`;
}
function statCard(l,v,sub,tone){

  const curva=[]; for(let k=1;k<pts.length;k++){const d=idadeDias(pts[k-1].d,pts[k].d);if(d)curva.push({de:pts[k-1].d,ate:pts[k].d,gmd:(pts[k].w-pts[k-1].w)/d,atual:k===i});}

    <div style="width:78px;text-align:right;font-size:12px;font-weight:700;flex:none">${fmtN(c.gmd,2)} kg/d</div></div>`).join('');
  openModalForm(mHead('scale','amber',`${brincoLabel(a)} — ${titulo} · ${fmtData(cur.d)}`)+`

  </tr></thead><tbody>${rows}</tbody></table></div></div>`;

function detalheAnimal(a,r){
  const catIcon={compra:'compra',racao:'racao',estrutura:'estrutura'};
  const catLabel={compra:'Compra',racao:'Ração',estrutura:'Estrutura'};
  const linhas=r.despesas.map(d=>{
    const editFn = d.cat==='compra'?`formAnimal('${a.id}')`:(d.cat==='racao'?`formRacao('${d.srcId}')`:`formEstrutura('${d.srcId}')`);
    const delBtn = d.cat==='compra'?'':`<button class="act-btn del" onclick="event.stopPropagation();${d.cat==='racao'?`delRacao('${d.srcId}')`:`delEstrutura('${d.srcId}')`}">${ic('trash')}</button>`;
    return `<tr><td>${fmtData(d.data)}</td><td><span class="es-in">Saída</span></td>
      <td><span class="tipo-cell">${ic(catIcon[d.cat])}${catLabel[d.cat]}</span></td>
      <td>${escapeHtml(d.desc||'—')}</td>
      <td class="num">${d.qtd||'—'}</td><td class="num">${d.volume?fmtN(d.volume)+' kg':'—'}</td>
      <td class="num money neg">${fmtBRL(d.valor)}</td><td>—</td>
      <td><span class="tag ${d.origem==='rat'?'rat':'ind'}">${d.origem==='rat'?'Rateio de lote':'Individual'}</span></td>
      <td class="num"><button class="act-btn" onclick="event.stopPropagation();${editFn}">${ic('edit')}</button>${delBtn}</td></tr>`;
  });
  if(r.venda){ const v=r.venda;
    linhas.push(`<tr><td>${fmtData(v.dataVenda)}</td><td><span class="es-out">Entrada</span></td>
      <td><span class="tipo-cell">${ic('venda')}Venda</span></td>
      <td>${fmtN(v.pesoFinalKg)} kg · ${fmtN(arr(v.pesoFinalKg),2)}@ · ${fmtBRL(v.precoArroba)}/@</td>
      <td class="num">—</td><td class="num">—</td><td class="num money pos">${fmtBRL(v.valorVenda)}</td>
      <td><span class="badge ${v.status==='recebido'?'b-receb':'b-aguard'}"><span class="bd"></span>${v.status==='recebido'?'Recebido':'Aguardando'}</span></td>
      <td>${v.status==='recebido'?fmtData(v.dataRecebimento):'prev. '+fmtData(v.dataPrevista)}</td>
      <td class="num"><button class="act-btn" onclick="event.stopPropagation();formVenda('${v.id}')">${ic('edit')}</button><button class="act-btn del" onclick="event.stopPropagation();delVenda('${v.id}')">${ic('trash')}</button></td></tr>`);
  }
  const corpo=linhas.length?linhas.join(''):`<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:20px">Nenhum custo ou venda lançado para este animal ainda.</td></tr>`;
  return `<div class="table-scroll"><table><thead><tr><th>Data</th><th>E/S</th><th>Tipo</th><th>Descrição</th><th class="num">Qtd</th><th class="num">Volume</th><th class="num">Valor</th><th>Status</th><th>Receb.</th><th></th></tr></thead><tbody>${corpo}</tbody></table></div>
  <div class="det-summary">
    <span>Idade: <b>${idadeTxt(a.dataNascimento,a.dataEncerramento)}</b></span>
    <span>Peso inicial: <b>${fmtN(a.pesoInicial)}kg · ${fmtN(arr(a.pesoInicial),2)}@</b></span>
    ${r.pesoFinal!=null?`<span>Peso final: <b>${fmtN(r.pesoFinal)}kg · ${fmtN(arr(r.pesoFinal),2)}@</b></span>`:''}
    <span>Despesas: <b class="neg">${fmtBRL(r.totalDesp)}</b></span>
    <span>Lucro: <b class="${r.lucro>=0?'pos':'neg'}">${fmtBRL(r.lucro)}</b></span></div>`;
}

function saveRaca(id){
  const nome=val('r_nome'); if(!nome)return toast('Informe o nome da raça','err');
  if(DB.racas.some(r=>r.nome.toLowerCase()===nome.toLowerCase()&&r.id!==id))return toast('Essa raça já existe','err');
  id?DB.racas.find(r=>r.id===id).nome=nome:DB.racas.push({id:uid(),nome});
  save();closeModal();toast('Raça salva');render();
}
function delRaca(id){ if(DB.animais.some(a=>a.racaId===id))return toast('Há animais usando essa raça','err');

function saveCor(id){

  if(!nome)return toast('Informe a cor','err'); if(!sigla)return toast('Informe a sigla','err');
  if(DB.coresBrinco.some(c=>c.sigla===sigla&&c.id!==id))return toast('Essa sigla já existe','err');
  if(DB.coresBrinco.some(c=>c.nome.toLowerCase()===nome.toLowerCase()&&c.id!==id))return toast('Essa cor já existe','err');
  if(id){const c=DB.coresBrinco.find(x=>x.id===id);c.nome=nome;c.sigla=sigla;} else DB.coresBrinco.push({id:uid(),nome,sigla});
  save();closeModal();toast('Cor salva');render();
}

function segCusto(p,d){
  document.querySelectorAll(`#${p}_seg button`).forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  document.getElementById(p+'_animalBox').style.display=d==='animal'?'flex':'none';
  document.getElementById(p+'_loteBox').style.display=d==='lote'?'flex':'none';
  document.getElementById(p+'_geralBox').style.display=d==='geral'?'flex':'none';
  previewRateio(p);
}
function previewRateio(p){
  const info=document.getElementById(p+'_rateioInfo');if(!info)return;
  const d=document.querySelector(`#${p}_seg button.on`).dataset.d;
  let ativos;
  if(d==='lote'){
    const sel=[...document.querySelectorAll(`#${p}_loteBox input:checked`)].map(c=>c.value);
    if(!sel.length){info.innerHTML='';return;}
    ativos=sel.flatMap(animaisAtivosDoLote);
  } else if(d==='geral'){
    ativos=DB.animais.filter(a=>a.status==='ativo');
  } else {info.innerHTML='';return;}
  const valor=numVal(p+'_valor');
  if(!ativos.length){info.innerHTML=`<div class="calc-line" style="background:var(--danger-l);color:#a83a24">${ic('x')} Nenhum animal ativo ${d==='lote'?'nos lotes selecionados':'na granja'}.</div>`;return;}
  const cota=valor?valor/ativos.length:0;
  const terc=ativos.filter(ehTerceiro), nT=terc.length;
  let h=`<div class="calc-line">${ic('settings')} Rateio entre <b>${ativos.length}</b> ativos${nT?` (<b>${nT}</b> de terceiro)`:''}${valor?` → <b>${fmtBRL(cota)}</b> por animal`:''}</div>`;
  if(nT&&valor&&p==='rc') h+=`<div class="calc-line" style="background:#FDF3E3;color:#8a5200;align-items:flex-start"><span style="flex:none">${ic('info')}</span><span><b>${fmtBRL(cota*nT)}</b> irão para <b>mão de obra</b> (ração de ${nT===1?'1 animal':nT+' animais'} de terceiro) e não entram no custo dos seus porcos.</span></div>`;
  if(nT&&valor&&p==='es') h+=`<div class="calc-line" style="background:#FDF3E3;color:#8a5200;align-items:flex-start"><span style="flex:none">${ic('info')}</span><span>A parte dos animais de terceiro (<b>${fmtBRL(cota*nT)}</b>) é custo <b>do proprietário</b>, não seu.</span></div>`;
  info.innerHTML=h;
}
function collectCusto(p){
  const data=val(p+'_data'),valor=numVal(p+'_valor');if(!valor)return{err:'Informe o valor'};
  const d=document.querySelector(`#${p}_seg button.on`).dataset.d;
  if(d==='animal'){const alvo=val(p+'_animal');if(!alvo)return{err:'Selecione o animal'};return{data,valor,destinoTipo:'animal',alvo,participantes:null};}
  if(d==='geral'){
    const ativos=DB.animais.filter(a=>a.status==='ativo');
    if(!ativos.length)return{err:'Nenhum animal ativo na granja'};
    return{data,valor,destinoTipo:'geral',alvo:null,participantes:ativos.map(a=>a.id)};
  }
  const lotesSel=[...document.querySelectorAll(`#${p}_loteBox input:checked`)].map(c=>c.value);
  if(!lotesSel.length)return{err:'Selecione ao menos um lote'};
  const ativos=lotesSel.flatMap(animaisAtivosDoLote);
  if(!ativos.length)return{err:'Nenhum animal ativo nos lotes selecionados'};
  return{data,valor,destinoTipo:'lote',alvo:lotesSel,participantes:ativos.map(a=>a.id)};
}

function pePesoInfo(){const p=numVal('pe_peso'),e=document.getElementById('pe_arroba');if(e)e.innerHTML=p?`= ${fmtN(arr(p),2)} @`:'';}
function fitaCalc(){
  const per=numVal('pe_fperim'),comp=numVal('pe_fcomp'),div=numVal('pe_fdiv')||14430;
  const e=document.getElementById('pe_fres'); if(!e)return;
  if(per>0&&comp>0&&div>0){ const peso=per*per*comp/div;
    e.style.display='flex'; e.innerHTML=`${ic('scale')} <span>Peso estimado: <b>${fmtN(peso,1)} kg</b></span><button type="button" class="btn ghost sm" style="margin-left:auto" onclick="fitaAplicar(${peso.toFixed(2)})">Usar este peso</button>`;
  } else e.style.display='none';
}
function fitaAplicar(peso){ setVal('pe_peso',(+peso).toFixed(1)); pePesoInfo();
  const div=numVal('pe_fdiv'); if(div>0&&div!==((DB.config&&DB.config.fitaDivisor)||14430)){ DB.config=Object.assign({},DB.config,{fitaDivisor:div}); save(); }
  toast('Peso aplicado'); }
function savePesagem(id,animalId){
  const aId=animalId||val('pe_animal'); if(!aId)return toast('Selecione o animal','err');
  const peso=numVal('pe_peso'); if(!peso)return toast('Informe o peso','err');
  const o={animalId:aId,data:val('pe_data'),peso};
  if(id)Object.assign(DB.pesagens.find(x=>x.id===id),o);else{o.id=uid();DB.pesagens.push(o);}
  save();closeModal();toast('Pesagem registrada');
  if(document.getElementById('modal').className.includes('wide')){} render();
}
function delPesagem(id,reopenAnimal){if(!confirm('Excluir esta pesagem?'))return;
  DB.pesagens=DB.pesagens.filter(x=>x.id!==id);save();toast('Pesagem excluída');
  if(reopenAnimal){const a=animalByCod(reopenAnimal);if(a)modalAnimal(a.id);} render();}


/* ============ Backup / Import / Exemplo ============ */
function exportData(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='suingest-backup-'+hoje()+'.json';a.click();toast('Backup baixado');}

/* ============ PDF (impressão) ============ */
const stripGrad=h=>String(h).replace(/fill="url\(#[^)]*\)"/g,'fill="none"');
function printDoc(titulo, inner){
  const logo=(document.querySelector('.logo-img')||{}).src||'';
  document.getElementById('printArea').innerHTML =
    `<div class="pdf-head">${logo?`<img src="${logo}" class="pdf-logo" alt="">`:''}<div><div class="pdf-title">${titulo}</div><div class="pdf-sub">SuinGest · gerado em ${fmtData(hoje())}</div></div></div>`
    + `<div class="pdf-content">${stripGrad(inner)}</div>`;
  window.print();
}
window.addEventListener('afterprint',()=>{const p=document.getElementById('printArea');if(p)p.innerHTML='';});
function pdfDashboard(){ printDoc('Resumo do negócio — Dashboard', document.getElementById('app').innerHTML); }
function pdfFromModal(){ const h=document.querySelector('#modal .modal-head h3'); const b=document.querySelector('#modal .modal-body');
  if(!b)return; printDoc(h?h.textContent.trim():'SuinGest', b.innerHTML); }

/* PDF da gestão: escolher animais */
function pdfGestaoAsk(){
  const animais=DB.animais.slice().sort((a,b)=>brincoLabel(a).localeCompare(brincoLabel(b)));
  if(!animais.length)return toast('Sem animais para exportar','err');
  openModalForm(mHead('gestao','emerald','Salvar PDF da Gestão')+`
   <div class="modal-body">
     <p style="font-size:13.5px;color:var(--muted)">Escolha os animais. O PDF traz a linha principal e o detalhe expandido de cada um.</p>
     <div style="display:flex;gap:8px"><button class="btn ghost sm" onclick="pdfSelAll(true)">Marcar todos</button><button class="btn ghost sm" onclick="pdfSelAll(false)">Limpar</button></div>
     <div style="max-height:44vh;overflow:auto;display:grid;gap:6px" id="pdfSelList">
       ${animais.map(a=>`<label class="pdf-sel"><input type="checkbox" class="pdfChk" value="${a.id}" checked> <b>${brincoLabel(a)}</b> · ${escapeHtml(racaNome(a.racaId))} ${badge(a.status)}</label>`).join('')}
     </div>
   </div>
   <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="pdfGestaoGerar()">Gerar PDF</button></div>`);
}
function pdfSelAll(v){ document.querySelectorAll('.pdfChk').forEach(c=>c.checked=v); }
function pdfGestaoGerar(){
  const ids=[...document.querySelectorAll('.pdfChk')].filter(c=>c.checked).map(c=>c.value);
  if(!ids.length)return toast('Selecione ao menos um animal','err');
  const inner=ids.map(id=>{const a=animalByCod(id);return a?blocoPdfAnimal(a):'';}).join('');
  closeModal(); printDoc(`Gestão — ${ids.length} animal(is)`, inner);
}
function blocoPdfAnimal(a){
  const r=resumoAnimal(a), pa=pesoAtual(a);
  const resumo=`<div class="pdf-resumo">
    ${mstat('Sexo',a.sexo==='macho'?'Macho':a.sexo==='femea'?'Fêmea':'—')}${mstat('Lote',a.lote||'—')}
    ${mstat('Nascimento',fmtData(a.dataNascimento))}${mstat('Chegada',fmtData(a.dataChegada))}
    ${mstat('Idade',idadeTxt(a.dataNascimento,a.dataEncerramento))}${mstat('Peso inicial',kgAt(a.pesoInicial))}
    ${mstat('Peso atual (vivo)',kgAt(pa))}${mstat('Despesas',fmtBRL(r.totalDesp))}
    ${mstat('Receita',fmtBRL(r.receita))}${mstat('Lucro',fmtBRL(r.lucro))}</div>`;
  return `<div class="pdf-animal"><h3>${ic('brinco')} ${brincoLabel(a)} — ${escapeHtml(racaNome(a.racaId))} ${badge(a.status)}</h3>${resumo}${detalheAnimal(a,r)}</div>`;
}
function importData(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.animais)throw 0;if(!confirm('Substituir todos os dados atuais pelos do arquivo?'))return;localStorage.setItem(KEY,JSON.stringify(d));DB=load();toast('Dados importados');render();}catch(err){toast('Arquivo inválido','err');}};
  rd.readAsText(f);ev.target.value='';}
function openSeed(){
  openModalForm(mHead('settings','emerald','Configurações')+`<div class="modal-body">
    <div class="field"><label>Rendimento de carcaça (%)</label>
      <input id="cfg_rend" type="number" step="0.1" min="40" max="100" value="${(DB.config&&DB.config.rendimento)||75}">
      <span class="help">Peso vivo estimado = peso de carcaça ÷ (rendimento÷100). Usado no ganho, conversão, curva e projeção de 6@. Faixa típica em suínos: 72% a 80%.</span></div>
    <div class="calc-line">${ic('info')} Ex.: 98 kg de carcaça a ${(DB.config&&DB.config.rendimento)||75}% ≈ <b id="cfg_ex">${fmtN(vivoDeCarcaca(98),1)} kg vivo</b>.</div>
    <hr style="border:none;border-top:1px solid var(--line);margin:4px 0">
    <div class="field"><label>Backup e restauração</label>
      <span class="help">Baixe um arquivo de backup regularmente para não perder dados, ou restaure a partir de um arquivo salvo anteriormente.</span>
      <div style="display:flex;gap:8px;margin-top:2px">
        <button class="btn ghost" onclick="exportData()" style="flex:1;justify-content:center">${ic('download')} Baixar backup</button>
        <button class="btn ghost" onclick="document.getElementById('importFile').click()" style="flex:1;justify-content:center">${ic('upload')} Importar backup</button>
      </div>
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:4px 0">
    <p style="font-size:14px;color:var(--muted)">Carregar um lote de demonstração ajuda a ver tudo funcionando. <b>Isso substitui os dados atuais.</b></p></div>
   <div class="modal-foot"><button class="btn danger" onclick="if(confirm('Apagar TODOS os dados?')){localStorage.removeItem(KEY);DB=load();closeModal();toast('Dados apagados');render();}">Apagar tudo</button>
    <button class="btn ghost" onclick="loadSeed()">Carregar exemplo</button><button class="btn" onclick="saveConfig()">Salvar</button></div>`);
  const inp=document.getElementById('cfg_rend'); if(inp)inp.oninput=()=>{const r=parseFloat(inp.value.replace(',','.'))||75;document.getElementById('cfg_ex').innerHTML=fmtN(98/(r/100),1)+' kg vivo';};
}
function saveConfig(){ const r=parseFloat(val('cfg_rend').replace(',','.')); if(!r||r<40||r>100)return toast('Rendimento entre 40 e 100%','err');
  DB.config=Object.assign({},DB.config,{rendimento:r}); save(); closeModal(); toast('Configuração salva'); render(); }
function loadSeed(){
  DB={racas:[],coresBrinco:[],animais:[],racoes:[],estruturas:[],vendas:[],pesagens:[],seq:0,config:{rendimento:75}};
  DB.coresBrinco=CORES_PADRAO.map(([nome,sigla])=>({id:uid(),nome,sigla}));
  const cor=s=>DB.coresBrinco.find(c=>c.sigla===s).id;
  const dur={id:uid(),nome:'Duroc'},land={id:uid(),nome:'Landrace'};DB.racas=[dur,land];
  const mk=(raca,corS,num,lote,peso,compra,nasc,dcompra,cheg,status,sexo,terceiro,dono)=>{const id=uid();DB.seq++;DB.animais.push({id,codigo:'P'+String(DB.seq).padStart(4,'0'),corId:cor(corS),brincoNum:num,brincoAno:'26',lote,racaId:raca,sexo,terceiro:!!terceiro,donoNome:dono||'',valorCompra:compra,pesoInicial:peso,dataNascimento:nasc,dataCompra:dcompra,dataChegada:cheg,status,dataEncerramento:null});return id;};
  const a1=mk(dur.id,'AMA','001','L001',22,180,'2026-01-05','2026-01-08','2026-01-10','vendido','macho'),
        a2=mk(dur.id,'AMA','002','L001',20,175,'2026-01-05','2026-01-08','2026-01-10','ativo','femea'),
        a3=mk(land.id,'AZL','001','L001',21,170,'2026-01-07','2026-01-10','2026-01-12','ativo','macho'),
        a4=mk(land.id,'VRM','015','L002',18,160,'2026-01-28','2026-01-30','2026-02-01','ativo','femea'),
        t1=mk(dur.id,'VRD','001','L001',19,300,'2026-01-06','2026-01-09','2026-01-10','ativo','macho',true,'José');
  DB.racoes.push({id:uid(),data:'2026-03-01',tipo:'Crescimento',qtd:6,volume:180,valor:900,destinoTipo:'lote',alvo:'L001',participantes:[a1,a2,a3,t1]});
  DB.racoes.push({id:uid(),data:'2026-04-15',tipo:'Terminação',qtd:8,volume:240,valor:1200,destinoTipo:'lote',alvo:'L001',participantes:[a2,a3,t1]});
  DB.racoes.push({id:uid(),data:'2026-03-20',tipo:'Crescimento',qtd:3,volume:90,valor:450,destinoTipo:'animal',alvo:a4,participantes:null});
  DB.estruturas.push({id:uid(),data:'2026-02-10',descricao:'Vacina + medicamento',valor:120,destinoTipo:'lote',alvo:'L001',participantes:[a1,a2,a3]});
  DB.vendas.push({id:uid(),animalId:a1,dataVenda:'2026-04-10',pesoFinalKg:118,precoArroba:150,valorVenda:1180,status:'recebido',dataRecebimento:'2026-04-12',dataPrevista:null});
  animalByCod(a1).dataEncerramento='2026-04-10';
  const pe=(aid,data,peso)=>DB.pesagens.push({id:uid(),animalId:aid,data,peso});
  pe(t1,'2026-02-10',44); pe(t1,'2026-03-10',70);
  pe(a1,'2026-02-10',48); pe(a1,'2026-03-10',82);
  pe(a2,'2026-02-10',45); pe(a2,'2026-03-10',72); pe(a2,'2026-04-10',95);
  pe(a3,'2026-02-12',44); pe(a3,'2026-03-12',70);
  pe(a4,'2026-03-01',38); pe(a4,'2026-04-01',60);
  save();closeModal();toast('Exemplo carregado');go('gestao');
}
function toast(msg,type='ok'){const t=document.createElement('div');t.className='toast '+(type==='err'?'err':'ok');t.innerHTML=ic(type==='err'?'x':'check')+msg;
  document.getElementById('toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2400);}

go('dashboard');
</script>
